name: Cold Outreach relationship-first tests
on:
  push:
    branches: [main, feature/relationship-first-reply-workflow]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run relationship-first regression tests
        run: node --test tests/*.test.cjs
